spring:
  application:
    name: ms-finanza
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/db_finanza?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Santiago
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate   # el esquema lo crea Flyway
    open-in-view: false
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

server:
  port: 8084

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true

# Secretos: SIEMPRE desde variables de entorno (.env), sin valores por defecto
jwt:
  secret: ${JWT_SECRET}

internal:
  key: ${INTERNAL_KEY}

app:
  comprobantes:
    dir: ${COMPROBANTES_DIR:./uploads}

# Webpay Plus - AMBIENTE DE INTEGRACIÓN de Transbank (sin dinero real).
# Código de comercio y API key vienen del .env (ver .env.example).
webpay:
  commerce-code: ${WEBPAY_COMMERCE_CODE}
  api-key: ${WEBPAY_API_KEY}
  # 10.0.2.2 = localhost del PC visto desde el emulador Android
  return-url: ${WEBPAY_RETURN_URL:http://10.0.2.2:8080/api/pagos/webpay/retorno}
