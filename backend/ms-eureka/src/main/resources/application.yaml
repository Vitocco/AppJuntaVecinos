spring:
  application:
    name: ms-eureka

server:
  port: 8761

eureka:
  instance:
    hostname: ${EUREKA_HOSTNAME:localhost}
  client:
    # El servidor no se registra a sí mismo
    register-with-eureka: false
    fetch-registry: false
  server:
    # En desarrollo: sin modo autopreservación para que los ms caídos desaparezcan rápido
    enable-self-preservation: false
